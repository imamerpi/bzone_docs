<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="800" height="450" rx="12" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect width="800" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="20" r="5" fill="#10b981"/>
  <rect x="250" y="10" width="300" height="20" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">BZone Interface Screenshot Preview</text>

  <!-- Central Graphic / Icon -->
  <g transform="translate(400, 210)">
    <circle cx="0" cy="-30" r="44" fill="#e0f2fe"/>
    <path d="M-18 -42 L18 -42 L18 -18 L-18 -18 Z M-14 -38 L14 -38 L14 -22 L-14 -22 Z" fill="#0284c7"/>
    <circle cx="-8" cy="-32" r="3" fill="#0284c7"/>
    <polygon points="12,-24 0,-34 -10,-24" fill="#0284c7"/>
    
    <text x="0" y="32" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#1e293b" text-anchor="middle">Placeholder Screenshot Panduan</text>
    <text x="0" y="56" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Silakan letakkan screenshot tampilan di folder static/src/img/</text>
  </g>
