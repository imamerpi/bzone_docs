<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="inboundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="outboundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="mutasiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="500" rx="16" fill="url(#canvasBg)"/>

  <!-- Header Section -->
  <g transform="translate(450, 45)" text-anchor="middle">
    <text font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" letter-spacing="0.5">BZone IT Inventory - Data Eligibility &amp; Verification Workflow</text>
    <text y="24" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">Syarat Kelayakan agar Produk &amp; Transaksi Muncul pada Laporan Pertanggungjawaban DJBC</text>
  </g>

  <!-- 3 Pillar Columns -->

  <!-- Column 1: Laporan Pemasukan (Inbound) -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="255" height="365" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 243 0 Q 255 0 255 12 L 255 46 L 0 46 Z" fill="url(#inboundGrad)"/>
    <text x="127" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">1. Laporan Pemasukan</text>
    
    <g transform="translate(18, 68)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" font-weight="600" fill="#f1f5f9">Status Picking = Done</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10">Penerimaan gudang tuntas divalidasi</text>

      <circle cx="6" cy="48" r="4" fill="#38bdf8"/>
      <text x="18" y="52" font-weight="600" fill="#f1f5f9">Operation Type = Inbound</text>
      <text x="18" y="66" fill="#94a3b8" font-size="10">Movement Type 'in' (non-scrap)</text>

      <circle cx="6" cy="90" r="4" fill="#38bdf8"/>
      <text x="18" y="94" font-weight="600" fill="#f1f5f9">Customs Document Wajib</text>
      <text x="18" y="108" fill="#94a3b8" font-size="10">BC 2.3 / BC 4.0 / BC 2.7 Masuk</text>
      <text x="18" y="122" fill="#94a3b8" font-size="10">No. &amp; Tgl Pendaftaran (6 digit)</text>

      <circle cx="6" cy="146" r="4" fill="#38bdf8"/>
      <text x="18" y="150" font-weight="600" fill="#f1f5f9">Master Produk Lengkap</text>
      <text x="18" y="164" fill="#94a3b8" font-size="10">Kode Barang + Linked PO/Valuta</text>

      <!-- Bottom Tag -->
      <rect x="0" y="235" width="219" height="34" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="110" y="256" font-weight="600" fill="#38bdf8" text-anchor="middle" font-size="10.5">Laporan Pemasukan DJBC</text>
    </g>
  </g>

  <!-- Column 2: Laporan Pengeluaran (Outbound) -->
  <g transform="translate(322, 95)" filter="url(#cardShadow)">
    <rect width="255" height="365" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 243 0 Q 255 0 255 12 L 255 46 L 0 46 Z" fill="url(#outboundGrad)"/>
    <text x="127" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">2. Laporan Pengeluaran</text>

    <g transform="translate(18, 68)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <circle cx="6" cy="6" r="4" fill="#fb923c"/>
      <text x="18" y="10" font-weight="600" fill="#f1f5f9">Status Delivery = Done</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10">Pengiriman barang tuntas divalidasi</text>

      <circle cx="6" cy="48" r="4" fill="#fb923c"/>
      <text x="18" y="52" font-weight="600" fill="#f1f5f9">Operation Type = Outbound</text>
      <text x="18" y="66" fill="#94a3b8" font-size="10">Movement Type 'out' (non-adj)</text>

      <circle cx="6" cy="90" r="4" fill="#fb923c"/>
      <text x="18" y="94" font-weight="600" fill="#f1f5f9">Customs Document Wajib</text>
      <text x="18" y="108" fill="#94a3b8" font-size="10">BC 2.5 / BC 4.1 / BC 2.7 / BC 3.0</text>
      <text x="18" y="122" fill="#94a3b8" font-size="10">No. &amp; Tgl Pendaftaran terisi</text>

      <circle cx="6" cy="146" r="4" fill="#fb923c"/>
      <text x="18" y="150" font-weight="600" fill="#f1f5f9">Commercial Valuation</text>
      <text x="18" y="164" fill="#94a3b8" font-size="10">Harga Satuan SO &amp; Kurs KMK</text>

      <!-- Bottom Tag -->
      <rect x="0" y="235" width="219" height="34" rx="6" fill="#c2410c" fill-opacity="0.3" stroke="#ea580c" stroke-width="1"/>
      <text x="110" y="256" font-weight="600" fill="#fb923c" text-anchor="middle" font-size="10.5">Laporan Pengeluaran DJBC</text>
    </g>
  </g>

  <!-- Column 3: 7 Laporan Mutasi IT Inventory -->
  <g transform="translate(605, 95)" filter="url(#cardShadow)">
    <rect width="255" height="365" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 243 0 Q 255 0 255 12 L 255 46 L 0 46 Z" fill="url(#mutasiGrad)"/>
    <text x="127" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">3. 7 Laporan Mutasi</text>

    <g transform="translate(18, 68)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <circle cx="6" cy="6" r="4" fill="#34d399"/>
      <text x="18" y="10" font-weight="600" fill="#f1f5f9">Master Product Aktif</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10">Active = True &amp; Kode Barang ada</text>

      <circle cx="6" cy="48" r="4" fill="#34d399"/>
      <text x="18" y="52" font-weight="600" fill="#f1f5f9">Flag Kawasan Berikat</text>
      <text x="18" y="66" fill="#94a3b8" font-size="10">Centang djbc_kb_ok = True</text>

      <circle cx="6" cy="90" r="4" fill="#34d399"/>
      <text x="18" y="94" font-weight="600" fill="#f1f5f9">Klasifikasi Mutasi Sesuai</text>
      <text x="18" y="108" fill="#94a3b8" font-size="10">RM / FG / WIP / Mesin / Scrap</text>

      <circle cx="6" cy="132" r="4" fill="#34d399"/>
      <text x="18" y="136" font-weight="600" fill="#f1f5f9">Lokasi Gudang Terpetakan</text>
      <text x="18" y="150" fill="#94a3b8" font-size="10">Flag djbc_kb_location pada Location</text>

      <circle cx="6" cy="174" r="4" fill="#34d399"/>
      <text x="18" y="178" font-weight="600" fill="#f1f5f9">Saldo &amp; Periode Wizard</text>
      <text x="18" y="192" fill="#94a3b8" font-size="10">Saldo Awal + In - Out ± Opname</text>

      <!-- Bottom Tag -->
      <rect x="0" y="235" width="219" height="34" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="110" y="256" font-weight="600" fill="#34d399" text-anchor="middle" font-size="10.5">Laporan Mutasi Bahan/Barang</text>
    </g>
  </g>
</svg>
